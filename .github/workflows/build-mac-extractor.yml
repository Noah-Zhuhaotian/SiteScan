name: Build Mac Extractor

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: extractor
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        working-directory: extractor
        run: |
          pyinstaller \
            --windowed \
            --name "SiteScan Extractor" \
            --hidden-import customtkinter \
            --collect-all customtkinter \
            --onedir \
            main.py

      - name: Zip .app
        working-directory: extractor/dist
        run: zip -r "SiteScan-Extractor-mac.zip" "SiteScan Extractor.app"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: SiteScan Extractor ${{ github.event.inputs.version }}
          body: |
            ## SiteScan Extractor for macOS

            Download `SiteScan-Extractor-mac.zip` below, unzip, and drag **SiteScan Extractor.app** to `/Applications`.

            **Requirements:** macOS with Google Chrome installed. No other setup needed.

            ### Usage
            1. Add competitor URLs and a brand name
            2. Click **Analyse & Add** — extraction takes ~10–20 s per site
            3. Click **Background**, **Text**, or **Accent** to copy that category's JSON
            4. Paste into [SiteScan](https://noah-zhuhaotian.github.io/SiteScan/) → Import JSON → Add colours
          files: extractor/dist/SiteScan-Extractor-mac.zip
          draft: false
          prerelease: false
